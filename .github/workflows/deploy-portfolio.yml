name: Deploy Portfolio to GitHub Pages

# 推送 portfolio/ 目录时自动发布在线作品集
# 首次使用前需在仓库 Settings -> Pages 将 Source 设为 GitHub Actions

on:
  push:
    branches: [main]
    paths: ['portfolio/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
